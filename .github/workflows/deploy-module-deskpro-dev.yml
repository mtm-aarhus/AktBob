name: Build & Deploy Deskpro Module to TEST

on:
  push:
    branches:
      - main
    paths:
      - 'src/Modules/Aktbob.Modules.Deskpro/**'

env:
  MODULE_PATH: Modules/Aktbob.Modules.Deskpro
  IMAGE_NAME: module-deskpro
  IMAGE_TAG: test
  REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.x

      - name: Restore NuGet Packages from GitHub Packages
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --name github \
            --username ${{ github.actor }} \
            --password ${{ secrets.GH_PACKAGES_TOKEN }} \
            --store-password-in-clear-text
          dotnet restore $MODULE_PATH

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Build Docker Image
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG $MODULE_PATH

      - name: Push to ACR
        run: |
          docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINERAPP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
