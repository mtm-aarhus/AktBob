services:
  
  api:
    build:
      dockerfile: AktBob.Api/Dockerfile
      args:
        ENVIRONMENT: "development"
    ports:
      - "5000:8080"
    depends_on:
      - sql

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "mhYQ%I9l*aOqYwQzCXip"
      
  # Modules
  deskpro-module:
    build:
      dockerfile: Modules/Aktbob.Modules.Deskpro/Dockerfile
      args:
        ENVIRONMENT: "development"
        APPINSIGHTS_INSTRUMENTATIONKEY: "test"
    ports:
      - "5001:80"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      
      
