services:
  
  mailserver:
    image: jijiechen/papercut:latest
    ports:
      - "25:25"
      - "37408:37408"
  
  
  api:
    build:
      dockerfile: AktBob.Api/Dockerfile
      args:
        ENVIRONMENT: "development"
    ports:
      - "5000:8080"
    depends_on:
      - sql


  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "mhYQ%I9l*aOqYwQzCXip"
      

  ###########   
  # Modules #
  ###########
  
  module-deskpro:
    build:
      dockerfile: Modules/Aktbob.Modules.Deskpro/Dockerfile
      args:
        ENVIRONMENT: "development"
        APPINSIGHTS_INSTRUMENTATIONKEY: "test"
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      
  
  module-open-orchestrator:
    build:
      dockerfile: Modules/Aktbob.Modules.OpenOrchestrator/Dockerfile
      args:
        ENVIRONMENT: "development"
        APPINSIGHTS_INSTRUMENTATIONKEY: "test"
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      

  ##############
  # Processors #
  ##############
  
  processor-create-afgoerelsesskrivelse:
    build:
      dockerfile: Processors/Aktbob.Processors.Afgørelsesskrivelse/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
      AzureWebJobsStorage: "UseDevelopmentStorage=true"
    env_file:
      - Processors/Aktbob.Processors.Afgørelsesskrivelse/development.env
    depends_on:
      - module-deskpro
      - module-open-orchestrator
      - sql
        
        
  processor-journalize-everything:
    build:
      dockerfile: Processors/Aktbob.Processors.JournalizeEverything/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
      AzureWebJobsStorage: "UseDevelopmentStorage=true"
    env_file:
      - Processors/Aktbob.Processors.JournalizeEverything/development.env
    depends_on:
      - module-deskpro
      - module-open-orchestrator
      - sql